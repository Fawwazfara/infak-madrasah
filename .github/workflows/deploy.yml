name: CI/CD Pipeline Laravel

on:
  push:
    branches:
      - main
      - staging

jobs:
  test_and_build:
    name: Build & Test (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # Versi PHP di cPanel teman Anda adalah 8.2!

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # Untuk build Vue/Vite

      - name: Install Dependensi PHP & Jalankan Test
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --optimize-autoloader
          cp .env.example .env
          php artisan key:generate
          # php artisan test # Uncomment jika Anda sudah membuat unit test

      - name: Build Frontend (Vue)
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Kemas File (Zip) agar cepat di-upload
        run: |
          # Kita zip semua file agar proses SCP tidak lemot (SCP file satu per satu sangat lama)
          # PENTING: Mengecualikan .env agar tidak menimpa .env asli di server!
          zip -r deploy.zip . -x "*.git*" -x "node_modules/*" -x "tests/*" -x ".env"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-zip
          path: deploy.zip

  deploy_production:
    name: Deploy ke Web Utama (Production)
    needs: test_and_build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-zip

      - name: Kirim File Zip ke Server via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy.zip"
          target: "/home/u1zh8984/public_html/assajjad.web.id/"

      - name: Ekstrak File di Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/u1zh8984/public_html/assajjad.web.id/
            unzip -q -o deploy.zip
            rm deploy.zip
            php artisan migrate --force
            php artisan optimize:clear