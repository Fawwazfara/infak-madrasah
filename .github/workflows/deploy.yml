name: Deploy to cPanel via SCP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies & Build frontend
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Composer dependencies
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Deploy files via SCP to cPanel
        uses: appleboy/scp-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "."
          target: ${{ secrets.SSH_TARGET_DIR }}
          strip_components: 0
          rm: true
          args: "--exclude=.git --exclude=.github --exclude=node_modules --exclude=tests --exclude=.env --exclude=*.zip --exclude=cookie*.txt --exclude=response.json --exclude=*.log --exclude=composer.phar --exclude=composer-2.2.phar --exclude=database/*.sqlite --exclude=.phpunit.result.cache --exclude=.phpunit.cache/* --exclude=public/hot --exclude=storage/logs/* --exclude=storage/framework/sessions/* --exclude=storage/framework/cache/data/*"

      - name: Run post-deploy commands on cPanel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.SSH_TARGET_DIR }}
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan view:cache